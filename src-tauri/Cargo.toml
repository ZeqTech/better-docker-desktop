[package]
name = "better-docker-desktop"
version = "0.2.0"
description = "Lean Docker Desktop alternative for containers, images, volumes and builds."
authors = ["you"]
edition = "2024"

[lib]
name = "better_docker_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
portable-pty = "0.9.0"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Faster dev builds: less debug info to generate and link.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# `pnpm tauri build --profile fast` (or --debug): an optimized-enough build without LTO.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 1
strip = false
